name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET 8
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DataManagement/DataManagement.sln

      - name: Build
        run: dotnet build DataManagement/DataManagement.sln --configuration Release --no-restore
